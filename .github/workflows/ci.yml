name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Links externos quebram sem nenhum commit (um repositório renomeado, uma aplicação
  # removida do Render). A execução semanal pega isso mesmo sem push.
  schedule:
    - cron: '0 12 * * 1' # segunda-feira, 09:00 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions

# Um push novo no mesmo branch cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só lê o repositório; não publica nada.
permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, build e links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # A versão vem de .node-version, o mesmo arquivo que o Workers Builds lê:
      # CI e deploy usam sempre o mesmo Node.
      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # npm ci instala exatamente o que está no package-lock.json e falha se ele
      # estiver fora de sincronia com o package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e schema dos projetos
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verificar links quebrados
        run: npm run links
